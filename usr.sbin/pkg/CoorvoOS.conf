#
# CoorvoOS base system packages (CoorvoOS-runtime, CoorvoOS-kernel-generic,
# ...), built with "make packages" and signed with the CoorvoOS repository
# key.  Third-party software still comes from FreeBSD-ports in FreeBSD.conf.
#
# The URL points at the local build output until pkg.coorvo.com is online.
# To disable this repository, create or edit
# /usr/local/etc/pkg/repos/CoorvoOS.conf, e.g.:
#
#   mkdir -p /usr/local/etc/pkg/repos
#   echo "CoorvoOS-base: { enabled: no }" >> /usr/local/etc/pkg/repos/CoorvoOS.conf
#

CoorvoOS-base: {
  url: "file:///usr/obj/usr/src/repo/${ABI}/latest",
  signature_type: "pubkey",
  pubkey: "/usr/share/keys/pkg/coorvo-repo.pub",
  enabled: yes
}
